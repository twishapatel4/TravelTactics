{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Tactics - Add Essentials</title>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/task.css' %}">
</head>
<body>
<header>
    <div class="heading-container">
        <span class="welcome-text">Helloo {{ request.user }} !!</span>
        <img src="{% static 'images/gps.png' %}" alt="Map Icon" class="map-icon">
        <h1 class="heading">Add your Essentials</h1>
        <div class="header-links">
            <a href="{% url 'intro' %}" class="home-link">Home</a>
            <form method="POST" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </div>
    </div>
</header>

<main>
    <a class="add-expense-btn" href="{% url 'packinglist:tasks' %}">Go back</a>

    <form method="POST" class="packing-list-container">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit" class="add-btn">
    </form>
</main>

<footer>
    <p class="tag-1">Travel Savvy. Travel Happy !!</p>
    <p class="brand">Travel Tactics</p>
</footer>
</body>
</html>
